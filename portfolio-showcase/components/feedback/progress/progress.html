<div class="nx-progress" role="progressbar" aria-valuenow="65" aria-valuemin="0" aria-valuemax="100" aria-label="Upload progress">
  <div class="nx-progress__bar" style="width: 65%;"></div>
</div>

<div class="nx-progress nx-progress--sm" role="progressbar" aria-valuenow="30" aria-valuemin="0" aria-valuemax="100" aria-label="Progress">
  <div class="nx-progress__bar" style="width: 30%;"></div>
</div>

<!-- Indeterminate (unknown duration) -->
<div class="nx-progress nx-progress--indeterminate" role="progressbar" aria-label="Loading">
  <div class="nx-progress__bar"></div>
</div>

<!-- Circular -->
<svg class="nx-progress-circle" viewBox="0 0 40 40" role="progressbar" aria-valuenow="70" aria-valuemin="0" aria-valuemax="100" aria-label="Completion">
  <circle class="nx-progress-circle__track" cx="20" cy="20" r="17"></circle>
  <circle class="nx-progress-circle__value" cx="20" cy="20" r="17" style="--nx-progress-value: 70;"></circle>
</svg>

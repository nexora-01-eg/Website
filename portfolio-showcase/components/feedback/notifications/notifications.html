<div class="nx-notif-panel" role="region" aria-label="Notifications">
  <div class="nx-notif-panel__header">
    <h3 class="nx-h4">Notifications</h3>
    <button class="nx-btn nx-btn--ghost nx-btn--sm" type="button">Mark all read</button>
  </div>

  <ul class="nx-notif-list">
    <li class="nx-notif nx-notif--unread">
      <span class="nx-notif__dot" aria-hidden="true"></span>
      <div class="nx-notif__body">
        <p class="nx-notif__text"><strong>New project</strong> added to Finance industry</p>
        <span class="nx-caption">2h ago</span>
      </div>
    </li>
    <li class="nx-notif">
      <span class="nx-notif__dot" aria-hidden="true"></span>
      <div class="nx-notif__body">
        <p class="nx-notif__text">Component library updated to v0.2.0</p>
        <span class="nx-caption">Yesterday</span>
      </div>
    </li>
  </ul>
</div>

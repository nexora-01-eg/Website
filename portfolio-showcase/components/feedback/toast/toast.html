<!-- Toast viewport — place once near </body>. Toasts are injected via toast.js -->
<div class="nx-toast-viewport" id="nx-toast-viewport" aria-live="polite" aria-atomic="true"></div>

<!-- Example toast markup (what toast.js generates) -->
<div class="nx-toast nx-toast--success" role="status">
  <span class="nx-toast__icon" aria-hidden="true">✓</span>
  <p class="nx-toast__message">Project published successfully.</p>
  <button class="nx-toast__close" type="button" aria-label="Dismiss notification">×</button>
</div>

<div class="nx-alert nx-alert--info" role="status">
  <span class="nx-alert__icon" aria-hidden="true">ℹ</span>
  <div class="nx-alert__body">
    <p class="nx-alert__title">Heads up</p>
    <p class="nx-alert__message">This project has unsaved changes.</p>
  </div>
</div>

<div class="nx-alert nx-alert--success" role="status">
  <span class="nx-alert__icon" aria-hidden="true">✓</span>
  <div class="nx-alert__body"><p class="nx-alert__message">Changes saved successfully.</p></div>
</div>

<div class="nx-alert nx-alert--warning" role="status">
  <span class="nx-alert__icon" aria-hidden="true">!</span>
  <div class="nx-alert__body"><p class="nx-alert__message">Your session expires in 5 minutes.</p></div>
</div>

<div class="nx-alert nx-alert--danger" role="alert">
  <span class="nx-alert__icon" aria-hidden="true">✕</span>
  <div class="nx-alert__body"><p class="nx-alert__message">Failed to publish. Check your connection.</p></div>
  <button class="nx-alert__dismiss" type="button" aria-label="Dismiss">×</button>
</div>

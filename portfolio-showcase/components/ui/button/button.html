<!-- NEXORA Button — usage example. Copy the markup, adjust text/attrs. -->
<button class="nx-btn nx-btn--primary nx-btn--md" type="button">
  Primary Action
</button>

<button class="nx-btn nx-btn--secondary nx-btn--md" type="button">
  Secondary
</button>

<button class="nx-btn nx-btn--ghost nx-btn--md" type="button">
  Ghost
</button>

<button class="nx-btn nx-btn--danger nx-btn--md" type="button">
  Delete
</button>

<button class="nx-btn nx-btn--primary nx-btn--sm" type="button">Small</button>
<button class="nx-btn nx-btn--primary nx-btn--lg" type="button">Large</button>

<button class="nx-btn nx-btn--primary nx-btn--md" type="button" disabled>
  Disabled
</button>

<button class="nx-btn nx-btn--primary nx-btn--md nx-btn--loading" type="button" aria-busy="true">
  <span class="nx-btn__spinner" aria-hidden="true"></span>
  Loading
</button>

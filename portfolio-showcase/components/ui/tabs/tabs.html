<div class="nx-tabs" data-nx-tabs>
  <div class="nx-tabs__list" role="tablist" aria-label="Project sections">
    <button class="nx-tabs__tab" role="tab" id="tab-overview" aria-controls="panel-overview" aria-selected="true" type="button">Overview</button>
    <button class="nx-tabs__tab" role="tab" id="tab-components" aria-controls="panel-components" aria-selected="false" type="button" tabindex="-1">Components</button>
    <button class="nx-tabs__tab" role="tab" id="tab-changelog" aria-controls="panel-changelog" aria-selected="false" type="button" tabindex="-1">Changelog</button>
  </div>

  <div class="nx-tabs__panel" role="tabpanel" id="panel-overview" aria-labelledby="tab-overview">
    <p class="nx-body nx-text-secondary">Overview content goes here.</p>
  </div>
  <div class="nx-tabs__panel" role="tabpanel" id="panel-components" aria-labelledby="tab-components" hidden>
    <p class="nx-body nx-text-secondary">Components content goes here.</p>
  </div>
  <div class="nx-tabs__panel" role="tabpanel" id="panel-changelog" aria-labelledby="tab-changelog" hidden>
    <p class="nx-body nx-text-secondary">Changelog content goes here.</p>
  </div>
</div>

<div class="nx-accordion" data-nx-accordion>
  <div class="nx-accordion__item">
    <h3>
      <button class="nx-accordion__trigger" type="button" aria-expanded="true" aria-controls="acc-panel-1" id="acc-trigger-1">
        What is the NEXORA Component Library?
        <span class="nx-accordion__icon" aria-hidden="true">⌄</span>
      </button>
    </h3>
    <div class="nx-accordion__panel" id="acc-panel-1" role="region" aria-labelledby="acc-trigger-1">
      <p class="nx-body nx-text-secondary">A reusable set of production-ready UI components shared across every NEXORA demo project.</p>
    </div>
  </div>

  <div class="nx-accordion__item">
    <h3>
      <button class="nx-accordion__trigger" type="button" aria-expanded="false" aria-controls="acc-panel-2" id="acc-trigger-2">
        Can items be open at the same time?
        <span class="nx-accordion__icon" aria-hidden="true">⌄</span>
      </button>
    </h3>
    <div class="nx-accordion__panel" id="acc-panel-2" role="region" aria-labelledby="acc-trigger-2" hidden>
      <p class="nx-body nx-text-secondary">Yes by default. Add <code>data-nx-accordion-single</code> to the root to allow only one open item at a time.</p>
    </div>
  </div>
</div>

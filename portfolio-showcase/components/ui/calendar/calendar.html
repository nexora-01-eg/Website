<div class="nx-calendar" role="application" aria-label="Calendar">
  <div class="nx-calendar__header">
    <button class="nx-calendar__nav" type="button" aria-label="Previous month">‹</button>
    <p class="nx-calendar__title" aria-live="polite">July 2026</p>
    <button class="nx-calendar__nav" type="button" aria-label="Next month">›</button>
  </div>

  <table class="nx-calendar__grid" role="grid">
    <thead>
      <tr>
        <th scope="col" abbr="Sunday">S</th><th scope="col" abbr="Monday">M</th><th scope="col" abbr="Tuesday">T</th>
        <th scope="col" abbr="Wednesday">W</th><th scope="col" abbr="Thursday">T</th><th scope="col" abbr="Friday">F</th><th scope="col" abbr="Saturday">S</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="nx-calendar__day nx-calendar__day--muted">28</td><td class="nx-calendar__day nx-calendar__day--muted">29</td><td class="nx-calendar__day nx-calendar__day--muted">30</td>
        <td class="nx-calendar__day"><button type="button">1</button></td><td class="nx-calendar__day"><button type="button">2</button></td>
        <td class="nx-calendar__day"><button type="button">3</button></td><td class="nx-calendar__day"><button type="button">4</button></td>
      </tr>
      <tr>
        <td class="nx-calendar__day"><button type="button">5</button></td><td class="nx-calendar__day"><button type="button">6</button></td>
        <td class="nx-calendar__day"><button type="button">7</button></td><td class="nx-calendar__day"><button type="button">8</button></td>
        <td class="nx-calendar__day"><button type="button">9</button></td><td class="nx-calendar__day"><button type="button">10</button></td>
        <td class="nx-calendar__day"><button type="button">11</button></td>
      </tr>
      <tr>
        <td class="nx-calendar__day"><button type="button">12</button></td><td class="nx-calendar__day"><button type="button">13</button></td>
        <td class="nx-calendar__day"><button type="button">14</button></td>
        <td class="nx-calendar__day nx-calendar__day--today"><button type="button" aria-current="date">15</button></td>
        <td class="nx-calendar__day"><button type="button">16</button></td><td class="nx-calendar__day"><button type="button">17</button></td>
        <td class="nx-calendar__day"><button type="button">18</button></td>
      </tr>
    </tbody>
  </table>
</div>

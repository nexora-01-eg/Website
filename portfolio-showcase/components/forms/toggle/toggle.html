<label class="nx-toggle">
  <input type="checkbox" class="nx-toggle__input" role="switch" aria-checked="false" />
  <span class="nx-toggle__track" aria-hidden="true"><span class="nx-toggle__thumb"></span></span>
  <span class="nx-toggle__label">Dark mode</span>
</label>

<label class="nx-toggle">
  <input type="checkbox" class="nx-toggle__input" role="switch" aria-checked="true" checked />
  <span class="nx-toggle__track" aria-hidden="true"><span class="nx-toggle__thumb"></span></span>
  <span class="nx-toggle__label">Enabled</span>
</label>

<label class="nx-toggle">
  <input type="checkbox" class="nx-toggle__input" role="switch" disabled />
  <span class="nx-toggle__track" aria-hidden="true"><span class="nx-toggle__thumb"></span></span>
  <span class="nx-toggle__label">Disabled</span>
</label>

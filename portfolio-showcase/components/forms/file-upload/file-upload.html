<div class="nx-file-upload" data-nx-file-upload>
  <input class="nx-file-upload__input" type="file" id="fu-input" multiple aria-describedby="fu-hint" />
  <label class="nx-file-upload__dropzone" for="fu-input">
    <span class="nx-file-upload__icon" aria-hidden="true">⇧</span>
    <span class="nx-body">Drag files here or <span class="nx-text-accent">browse</span></span>
    <span class="nx-caption" id="fu-hint">PNG, JPG up to 10MB</span>
  </label>

  <ul class="nx-file-upload__list" aria-live="polite"></ul>
</div>

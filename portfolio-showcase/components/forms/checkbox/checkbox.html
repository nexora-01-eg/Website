<label class="nx-checkbox">
  <input type="checkbox" class="nx-checkbox__input" name="terms" />
  <span class="nx-checkbox__box" aria-hidden="true"></span>
  <span class="nx-checkbox__label">I agree to the terms</span>
</label>

<label class="nx-checkbox">
  <input type="checkbox" class="nx-checkbox__input" checked />
  <span class="nx-checkbox__box" aria-hidden="true"></span>
  <span class="nx-checkbox__label">Checked</span>
</label>

<label class="nx-checkbox">
  <input type="checkbox" class="nx-checkbox__input" disabled />
  <span class="nx-checkbox__box" aria-hidden="true"></span>
  <span class="nx-checkbox__label">Disabled</span>
</label>

<!-- Indeterminate — set via JS: el.indeterminate = true -->
<label class="nx-checkbox">
  <input type="checkbox" class="nx-checkbox__input" data-nx-indeterminate />
  <span class="nx-checkbox__box" aria-hidden="true"></span>
  <span class="nx-checkbox__label">Select all (partial)</span>
</label>

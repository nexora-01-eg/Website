<button class="nx-btn nx-btn--primary nx-btn--md" type="button" data-nx-modal-open="demo-modal">Open modal</button>

<div class="nx-modal-overlay" id="demo-modal" data-nx-modal role="dialog" aria-modal="true" aria-labelledby="demo-modal-title" hidden>
  <div class="nx-modal">
    <div class="nx-modal__header">
      <h2 class="nx-h4" id="demo-modal-title">Delete project?</h2>
      <button class="nx-modal__close" type="button" aria-label="Close dialog" data-nx-modal-close>×</button>
    </div>
    <div class="nx-modal__body">
      <p class="nx-body nx-text-secondary">This action can't be undone. The project and all its assets will be permanently removed.</p>
    </div>
    <div class="nx-modal__footer">
      <button class="nx-btn nx-btn--ghost nx-btn--md" type="button" data-nx-modal-close>Cancel</button>
      <button class="nx-btn nx-btn--danger nx-btn--md" type="button">Delete</button>
    </div>
  </div>
</div>
